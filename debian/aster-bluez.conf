<!-- Aster may use only the BlueZ methods required by its rostered LE path. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="aster">
    <deny send_destination="org.bluez" send_type="method_call"/>

    <allow send_destination="org.bluez"
           send_interface="org.freedesktop.DBus.ObjectManager"
           send_member="GetManagedObjects"
           send_type="method_call"/>
    <allow send_destination="org.bluez"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"
           send_type="method_call"/>

    <allow send_destination="org.bluez"
           send_interface="org.bluez.Adapter1"
           send_member="SetDiscoveryFilter"
           send_type="method_call"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.Adapter1"
           send_member="StartDiscovery"
           send_type="method_call"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.Adapter1"
           send_member="StopDiscovery"
           send_type="method_call"/>

    <allow send_destination="org.bluez"
           send_interface="org.bluez.LEAdvertisingManager1"
           send_member="RegisterAdvertisement"
           send_type="method_call"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.LEAdvertisingManager1"
           send_member="UnregisterAdvertisement"
           send_type="method_call"/>
  </policy>
</busconfig>
