name: "Build: .deb arm64"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-arm64-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "Build: .deb arm64"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.4.28
          cache: false
      - name: Provision build tools and locked Cargo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper build-essential pkg-config python3-venv python3-dev libicu-dev
          cargo install --locked --version 0.5.9 cargo-cyclonedx --root "$RUNNER_TEMP/sbom-cargo"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/sbom-python"
          "$RUNNER_TEMP/sbom-python/bin/pip" install cyclonedx-editor-validator==0.34.0
          echo "$RUNNER_TEMP/sbom-cargo/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/sbom-python/bin" >> "$GITHUB_PATH"
          cargo fetch --locked
      - name: Build the native package offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: dpkg-buildpackage -b -us -uc
      - name: Verify package payload
        run: python3 tools/test_deb_package.py ../aster_*_arm64.deb arm64
      - name: Install and exercise the protected service on the disposable runner
        run: sudo bash tools/test-deb-install.sh ../aster_*_arm64.deb
      - name: Retain package and build records
        run: |
          mkdir -p target/deb-artifacts
          cp ../aster_*.deb ../aster_*.buildinfo ../aster_*.changes target/deb-artifacts/
          cp -r target/deb-metadata target/deb-artifacts/metadata
          cd target/deb-artifacts
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload installable Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: target/deb-artifacts/*_arm64.deb
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload package build records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aster-deb-arm64-metadata-${{ github.sha }}
          path: |
            target/deb-artifacts/
            !target/deb-artifacts/*.deb
          if-no-files-found: error
          retention-days: 14
