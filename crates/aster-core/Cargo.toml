[package]
name = "aster-core"
description = "Transport-neutral reference core for the Aster Mesh Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "aster_mesh"

[features]
default = ["reference-session"]
# Protocol contracts used by transport adapters and conformance tooling.
adapter-sdk = ["reference-session"]
# Reference provisioning, authenticated sessions, and protected source adapters.
reference-session = []
# Deterministic authenticated-session fixtures used only by the separate fuzz crate.
fuzzing = ["reference-session"]
# Compatibility seams for downstream authenticated transport tests.
test-utils = ["reference-session"]

[dependencies]
aes-gcm.workspace = true
getrandom.workspace = true
hkdf.workspace = true
ml-dsa.workspace = true
ml-kem.workspace = true
p256.workspace = true
rand_core.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
