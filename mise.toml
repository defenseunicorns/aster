[tools]
rust = "1.97.1"
go = "1.26.7"
python = "3.13.7"
ripgrep = "15.2.0"
buf = "1.72.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.20.0"

[env]
RUST_BACKTRACE = "1"
PYTHONDONTWRITEBYTECODE = "1"

[tasks.check]
description = "Run format, lint, unit, binding, and conformance checks"
run = [
  { task = "check-foundation" },
  { task = "check-clippy" },
  { task = "check-workspace-tests" },
  { task = "check-integration" },
]

[tasks.check-foundation]
description = "Run formatting, policy, traceability, and receipt checks"
run = [
  { task = "check-lockfiles" },
  { task = "check-foundation-core" },
  { task = "check-compose-policy" },
]

[tasks.check-lockfiles]
description = "Validate committed Cargo dependency graphs and their rejection tests"
run = [
  "sh tools/check-cargo-lockfiles.sh",
  "python3 tools/test-check-cargo-lockfiles.py",
]

[tasks.check-foundation-core]
description = "Run foundation checks after committed Cargo graphs are validated"
run = [
  "cargo fmt --all -- --check",
  "sh tools/check-agent-proto.sh",
  "python3 tools/check-project-license.py",
  "python3 tools/check-implementation-requirements.py",
  "python3 tools/check-protocol-version-contract.py",
  "python3 tools/test-protocol-version-contract.py",
  "python3 .github/scripts/test-ci-test-lanes.py",
  "python3 .github/scripts/test-nextest-timing.py",
  "python3 tools/test-run-fuzz-smoke.py",
  "python3 tools/test_aster_tour_ui.py",
  "python3 tools/test_aster_mesh_playground.py",
  "python3 tools/test_aster_lan_mvp.py",
  "python3 tools/test_aster_lan_mvp_compose.py",
  "python3 tools/test_aster_deb_compose.py",
  "python3 tools/test_aster_lan_scale_compose.py",
  "python3 tools/test_aster_hierarchy_mvp_compose.py",
  "python3 tools/test_aster_hierarchy_scale_compose.py",
  "python3 tools/test_aster_path_lab.py",
  "python3 tools/aster_path_lab.py docker/path-lab/scenarios/netem-readback-smoke.json",
  "python3 tools/test_aster_path_delivery.py",
  "python3 tools/test_aster_path_diagnostic.py",
  "python3 tools/aster_path_delivery.py docker/path-lab/scenarios/event-delivery-netem.json",
  "sh -n docker/lan-scale/init-state.sh",
  "sh -n docker/hierarchy-mvp/demo-node-entrypoint.sh",
  "python3 tools/test-selected-n32-receipt.py",
  "python3 tools/test-selected-iroh-nat-receipt.py",
  "python3 tools/test-selected-live-mutable-receipt.py",
  "python3 tools/test-selected-live-blob-receipt.py",
  "python3 tools/test-selected-live-event-receipt.py",
  "python3 tools/test-selected-live-state-subscription-receipt.py",
  "python3 tools/test-selected-live-record-subscription-receipt.py",
  "python3 tools/test-selected-live-blob-subscription-receipt.py",
  "python3 tools/test-linux-event-mvp-qualification.py",
  "python3 tools/check-selected-node-dependency-boundary.py",
  "python3 tools/check-netlink-packet-core-patch.py",
  "sh tools/test-netlink-packet-core-patch.sh",
  "sh ./tools/check-dependency-exception-scope.sh",
  "sh ./tools/test-dependency-exception-scope.sh",
]

[tasks.check-compose-policy]
description = "Validate Compose-provider delivery policy without Docker"
run = [
  "python3 tools/test_aster_compose_delivery.py",
  "python3 tools/test_inspect_aster_compose_oci.py",
]

[tasks.check-clippy]
description = "Run Clippy for every Rust workspace target and feature"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.check-workspace-tests]
description = "Run the complete all-feature Rust workspace tests"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = [
  "sh tools/with-test-resources.sh cargo nextest run --locked --workspace --all-features --no-fail-fast --test-threads 2",
  "sh tools/with-test-resources.sh cargo test --locked --workspace --all-features --doc",
]

[tasks.check-rust-ci-slice-1]
description = "Run the first required-CI Rust test slice with retained JUnit timing"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = "sh tools/with-test-resources.sh cargo nextest run --profile ci --locked --workspace --all-features --test-threads 2 --partition slice:1/2"

[tasks.check-rust-ci-slice-2]
description = "Run the second required-CI Rust test slice with retained JUnit timing"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = "sh tools/with-test-resources.sh cargo nextest run --profile ci --locked --workspace --all-features --test-threads 2 --partition slice:2/2"

[tasks.qualify-generated-blob]
description = "Run the ignored generated 100 MiB Blob pipeline qualification"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = "sh tools/with-test-resources.sh cargo nextest run --locked -p aster-core --all-features --run-ignored ignored-only -E 'test(=blob::tests::qualify_generated_100mb_blob_pipeline)'"

[tasks.qualify-local-blob-above-network-limit]
description = "Run the ignored local Blob-above-network-limit qualification"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = "sh tools/with-test-resources.sh cargo nextest run --locked -p aster-node --all-features --lib --run-ignored ignored-only --test-threads 1 -E 'test(=runtime::tests::qualify_valid_local_blob_above_network_limit)'"

[tasks.qualify-near-two-mib-events]
description = "Run the ignored near-2-MiB bidirectional Event qualification"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = "sh tools/with-test-resources.sh cargo nextest run --locked -p aster-node --all-features --lib --run-ignored ignored-only --test-threads 1 -E 'test(=runtime::tests::qualify_current_stack_near_two_mib_events_each_direction)'"

[tasks.qualify-control-mesh]
description = "Run the complete ignored 23-process control-mesh qualification"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = "sh tools/with-test-resources.sh cargo nextest run --locked -p aster-node --all-features --test mesh_cli --run-ignored ignored-only --test-threads 1 -E 'test(=four_real_processes_propagate_controls_without_authority_and_exclude_captured_leaf)'"

[tasks.qualify-ping-pong-mesh]
description = "Run both complete ignored Ping/Pong mesh qualifications serially"
tools = { "cargo:cargo-nextest" = "0.9.145" }
run = "sh tools/with-test-resources.sh cargo nextest run --locked -p aster-node --all-features --test mesh_cli --run-ignored ignored-only --test-threads 1 -E 'test(=two_real_processes_use_the_same_stopped_state_ping_pong_plan) | test(=four_real_processes_default_to_ping_pong_and_restart_cleanly)'"

[tasks.check-integration]
description = "Run real-process, binding, and conformance checks"
run = [
  "sh tools/test-aster-mesh-playground-real.sh",
  "sh tools/test-aster-hello-real.sh",
  "sh tools/test-aster-numbered-go-real.sh",
  "cargo build --locked -p aster-ffi",
  "cc -std=c11 -Wall -Wextra -Werror -pedantic -Ibindings/c -fsyntax-only bindings/c/header_smoke.c",
  "c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ibindings/c -fsyntax-only bindings/c/header_smoke.cpp",
  "cargo run --locked -p aster-conformance -- --self-test",
  "python3 conformance/python_wire_oracle.py conformance/vectors/wire-v1.tsv",
  "python3 conformance/blob_stream_oracle.py",
  { task = "conformance-profile-v0-r2" },
  "python3 -m unittest discover -s bindings/python/tests",
  "python3 -m unittest discover -s lab/tests",
  "test -z \"$(gofmt -l bindings/go)\"",
  "GOCACHE=/tmp/aster-mesh-go-cache go -C bindings/go test -tags aster_workspace ./...",
  "test -z \"$(gofmt -l conformance/agent-go)\"",
  "go -C conformance/agent-go test ./...",
  "sh tools/check-agent-go-generated.sh",
]

[tasks.conformance-profile-v0-r2]
description = "Verify the standalone candidate-neutral v0-r2 conformance corpus"
run = [
  "cargo fmt --manifest-path conformance/evaluation-v0/runner/Cargo.toml -- --check",
  "cargo test --locked --offline --manifest-path conformance/evaluation-v0/runner/Cargo.toml",
  "cargo clippy --locked --offline --manifest-path conformance/evaluation-v0/runner/Cargo.toml --all-targets -- -D warnings",
  "python3 conformance/evaluation-v0/check_v0_r2.py",
]

[tasks.fuzz-smoke]
description = "Run bounded sanitizer-instrumented decoder fuzz campaigns"
tools = { rust = "nightly-2026-08-18", "cargo:cargo-fuzz" = "0.13.2" }
run = "sh ./tools/run-fuzz-smoke.sh"

[tasks.qualification-validator]
description = "Run focused Linux Event MVP qualification validator tests"
run = "python3 tools/test-linux-event-mvp-qualification.py"

[tasks.ci-python-preflight]
description = "Fail closed unless CI uses the exact compatible signal-safe interpreter"
run = "python3 .github/scripts/check-ci-python.py"

[tasks.agent-process-smoke]
description = "Exercise bounded customer-agent crash, restart, reload, and drain behavior"
run = '''
set -eu
task_root=""
cleanup() {
  case "$task_root" in
    "") return 0 ;;
    /tmp/aster-agent-process-smoke.*) rm -rf -- "$task_root"; task_root="" ;;
    *) return 1 ;;
  esac
}
trap cleanup EXIT HUP INT TERM
task_root="$(mktemp -d /tmp/aster-agent-process-smoke.XXXXXX)"
chmod 700 "$task_root"
cargo build --locked -p aster-agent --bin aster-agent-acceptance-fixture --features client,acceptance-test-provider
GOCACHE="$task_root/go-cache" go -C conformance/agent-go build -o "$task_root/agent-smoke" ./cmd/agent-smoke
fixture="target/debug/aster-agent-acceptance-fixture"
runtime_root="$task_root/runtime"
mkdir "$runtime_root"
chmod 700 "$runtime_root"
"$fixture" prepare --root "$runtime_root"
python3 tools/check-aster-agent-process.py \
  --agent "$fixture" \
  --config "$runtime_root/agent.json" \
  --client "$task_root/agent-smoke" \
  --timeout-seconds 30
'''

[tasks.playground]
description = "Launch a bounded interactive real-process Event message playground"
run = "sh ./tools/aster-mesh-playground.sh"

[tasks.hello]
description = "Open the human-driven three-node Aster Field Notes hello experience"
run = "sh ./tools/aster-hello.sh"

[tasks.hello-smoke]
description = "Exercise the human-driven Field Notes introduction with real agents"
run = "sh ./tools/test-aster-hello-real.sh"

[tasks.playground-smoke]
description = "Exercise delayed Event movement across three real agent processes"
run = "sh ./tools/test-aster-mesh-playground-real.sh"

[tasks.lan-mvp-compose]
description = "Exercise the staged rosterless LAN Event MVP on one Docker bridge"
run = "python3 tools/aster_lan_mvp_compose.py"

[tasks.deb-compose]
description = "Test an existing Aster .deb on two Ubuntu containers with static peers"
run = "python3 tools/aster_deb_compose.py"

[tasks.lan-scale-compose]
description = "Measure one generated 8, 16, or 32-node rosterless LAN baseline"
run = "python3 tools/aster_lan_scale_compose.py"

[tasks.hierarchy-mvp-compose]
description = "Exercise the five-node rosterless alpha-parent-bravo Event bridge MVP"
run = "python3 tools/aster_hierarchy_mvp_compose.py"

[tasks.hierarchy-scale-compose]
description = "Measure one generated bounded static Event hierarchy tier"
run = "python3 tools/aster_hierarchy_scale_compose.py"

[tasks.path-lab-plan]
description = "Validate the bounded path-lab netem smoke scenario"
run = "python3 tools/aster_path_lab.py docker/path-lab/scenarios/netem-readback-smoke.json"

[tasks.path-lab-smoke]
description = "Execute the bounded Containerlab netem read-back smoke on Linux"
run = "python3 tools/aster_path_lab.py docker/path-lab/scenarios/netem-readback-smoke.json --execute"

[tasks.path-delivery-plan]
description = "Validate the fixed real-Event path-delivery scenario"
run = "python3 tools/aster_path_delivery.py docker/path-lab/scenarios/event-delivery-netem.json"

[tasks.path-delivery-smoke]
description = "Execute one real Event through isolated Docker segments and WAN netem on Linux"
run = "python3 tools/aster_path_delivery.py docker/path-lab/scenarios/event-delivery-netem.json --execute"

[tasks.compose-agent-plan]
description = "Validate the ordinary Compose delivery profile without Docker"
run = "python3 tools/aster_compose_delivery.py docker/compose-agent/compose.yaml --example-plan"

[tasks.tour]
description = "Run the fastest two-node causal Ping/Pong capability tour"
run = "sh ./tools/aster-tour.sh quick"

[tasks.tour-relay]
description = "Run the three-node payload-blind relay capability tour"
run = "sh ./tools/aster-tour.sh relay"

[tasks.tour-control]
description = "Run the four-node revocation and rekey capability tour"
run = "sh ./tools/aster-tour.sh control"

[tasks.reconcile-bakeoff]
description = "Gate the non-production reconciliation matrix through 1,000 items"
run = "ASTER_BAKEOFF_MAX_ITEMS=1000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=0 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-scale]
description = "Gate the opt-in reconciliation matrix through 10,000 items"
run = "ASTER_BAKEOFF_MAX_ITEMS=10000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=0 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-scale-report]
description = "Run the algorithm-error-tolerant 10,000-item diagnostic"
run = "ASTER_BAKEOFF_MAX_ITEMS=10000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=1 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-full]
description = "Gate the opt-in reconciliation matrix through 100,000 items"
run = "ASTER_BAKEOFF_MAX_ITEMS=100000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=0 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-full-report]
description = "Run the algorithm-error-tolerant 100,000-item diagnostic"
run = "ASTER_BAKEOFF_MAX_ITEMS=100000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=1 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.dependency-exception-scope]
description = "Verify active pilot and lock-only advisory dispositions cannot escape their reviewed graphs"
run = [
  "sh ./tools/check-dependency-exception-scope.sh",
  "sh ./tools/test-dependency-exception-scope.sh",
]

[tasks.protocol-version-contract]
description = "Verify implemented and normative semantic-version registries align"
run = [
  "python3 tools/check-protocol-version-contract.py",
  "python3 tools/test-protocol-version-contract.py",
]

[tasks.age-reference-interop]
description = "Verify bidirectional interoperability with official Go age v1.3.1"
run = "sh ./tools/age-reference/check.sh"

[tasks.age-reference-audit]
description = "Audit the Go age oracle with exact govulncheck v1.6.0"
run = "sh ./tools/age-reference/audit.sh"

[tasks.build]
description = "Build aster, aster-agent, and asterctl for Linux x86_64"
run = "bash tools/build-linux-x86_64.sh"

[tasks.build-deb]
description = "Build the native Ubuntu 24.04 amd64 or arm64 evaluation deb"
run = "dpkg-buildpackage -b -us -uc"
