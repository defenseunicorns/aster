[package]
name = "aster-ffi"
description = "C ABI for the selected redb-backed Aster node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
aster-core = { version = "=0.1.0-alpha.1", path = "../aster-core", default-features = false, features = ["reference-session"] }
aster-node = { path = "../aster-node" }
tokio.workspace = true
zeroize.workspace = true

[lints.rust]
# FFI pointer validation necessarily uses narrowly scoped unsafe blocks. The
# safe Rust core continues to forbid unsafe code.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
aster-redb-store = { path = "../aster-redb-store" }
