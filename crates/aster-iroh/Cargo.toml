[package]
name = "aster-iroh"
description = "Profile-independent authenticated Iroh carrier for Aster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
nearby-discovery = ["dep:iroh-mdns-address-lookup", "dep:swarm-discovery"]
test-utils = ["dep:iroh-relay"]

[dependencies]
futures.workspace = true
iroh.workspace = true
iroh-mdns-address-lookup = { workspace = true, optional = true }
iroh-relay = { workspace = true, features = ["server", "test-utils"], optional = true }
rustls.workspace = true
swarm-discovery = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
