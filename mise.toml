[tools]
rust = "1.97.1"
go = "1.26.7"
python = "3.13.7"
ripgrep = "15.2.0"
buf = "1.72.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.20.0"

[env]
RUST_BACKTRACE = "1"
PYTHONDONTWRITEBYTECODE = "1"

[tasks.check]
description = "Run format, lint, unit, binding, and conformance checks"
run = [
  "cargo fmt --all -- --check",
  "sh tools/check-agent-proto.sh",
  "python3 tools/check-project-license.py",
  "python3 tools/check-implementation-requirements.py",
  "python3 tools/test-documentation-archive.py",
  "python3 tools/check-documentation-archive.py",
  "python3 tools/test_aster_tour_ui.py",
  "python3 tools/test_aster_mesh_playground.py",
  "python3 tools/test_aster_lan_mvp.py",
  "python3 tools/test_aster_lan_mvp_compose.py",
  "python3 tools/test_aster_deb_compose.py",
  "python3 tools/test_aster_lan_scale_compose.py",
  "python3 tools/test_aster_hierarchy_mvp_compose.py",
  "python3 tools/test_aster_hierarchy_scale_compose.py",
  "python3 tools/test_aster_path_lab.py",
  "python3 tools/aster_path_lab.py docker/path-lab/scenarios/netem-readback-smoke.json",
  "python3 tools/test_aster_path_delivery.py",
  "python3 tools/aster_path_delivery.py docker/path-lab/scenarios/event-delivery-netem.json",
  "sh -n docker/lan-scale/init-state.sh",
  "sh -n docker/hierarchy-mvp/demo-node-entrypoint.sh",
  "python3 tools/test-selected-n32-receipt.py",
  "python3 tools/test-selected-iroh-nat-receipt.py",
  "python3 tools/test-selected-live-mutable-receipt.py",
  "python3 tools/test-selected-live-blob-receipt.py",
  "python3 tools/test-selected-live-event-receipt.py",
  "python3 tools/test-selected-live-state-subscription-receipt.py",
  "python3 tools/test-selected-live-record-subscription-receipt.py",
  "python3 tools/test-selected-live-blob-subscription-receipt.py",
  "python3 tools/test-linux-event-mvp-qualification.py",
  "python3 tools/check-selected-node-dependency-boundary.py",
  "python3 tools/check-netlink-packet-core-patch.py",
  "sh tools/test-netlink-packet-core-patch.sh",
  "python3 tools/check-retained-libp2p-oracle-boundary.py",
  "python3 tools/test-retained-libp2p-oracle-boundary.py",
  "sh ./tools/check-dependency-exception-scope.sh",
  "sh ./tools/test-dependency-exception-scope.sh",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "sh tools/with-test-resources.sh cargo test --locked --workspace --all-features",
  "sh tools/test-aster-mesh-playground-real.sh",
  "sh tools/test-aster-hello-real.sh",
  "cargo build --locked -p aster-ffi",
  "cc -std=c11 -Wall -Wextra -Werror -pedantic -Ibindings/c -fsyntax-only bindings/c/header_smoke.c",
  "c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ibindings/c -fsyntax-only bindings/c/header_smoke.cpp",
  "cargo run --locked -p aster-conformance -- --self-test",
  "python3 conformance/python_wire_oracle.py conformance/vectors/wire-v1.tsv",
  "mise run conformance-profile-v0-r2",
  "python3 -m unittest discover -s bindings/python/tests",
  "python3 -m unittest discover -s lab/tests",
  "test -z \"$(gofmt -l bindings/go)\"",
  "GOCACHE=/tmp/aster-mesh-go-cache go -C bindings/go test -tags aster_workspace ./...",
  "test -z \"$(gofmt -l conformance/agent-go)\"",
  "go -C conformance/agent-go test ./...",
  "sh tools/check-agent-go-generated.sh",
]

[tasks.documentation-archive]
description = "Verify the frozen documentation archive and candidate inventory"
run = [
  "python3 tools/test-documentation-archive.py",
  "python3 tools/check-documentation-archive.py",
]

[tasks.conformance-profile-v0-r2]
description = "Verify the standalone candidate-neutral v0-r2 conformance corpus"
run = [
  "cargo fmt --manifest-path conformance/evaluation-v0/runner/Cargo.toml -- --check",
  "cargo test --locked --offline --manifest-path conformance/evaluation-v0/runner/Cargo.toml",
  "cargo clippy --locked --offline --manifest-path conformance/evaluation-v0/runner/Cargo.toml --all-targets -- -D warnings",
  "python3 conformance/evaluation-v0/check_v0_r2.py",
]

[tasks.fuzz-smoke]
description = "Run bounded sanitizer-instrumented decoder fuzz campaigns"
run = "sh ./tools/run-fuzz-smoke.sh"

[tasks.qualification-validator]
description = "Run focused Linux Event MVP qualification validator tests"
run = "python3 tools/test-linux-event-mvp-qualification.py"

[tasks.ci-python-preflight]
description = "Fail closed unless CI uses the exact compatible signal-safe interpreter"
run = "python3 .github/scripts/check-ci-python.py"

[tasks.agent-process-smoke]
description = "Exercise bounded customer-agent crash, restart, reload, and drain behavior"
run = '''
set -eu
task_root=""
cleanup() {
  case "$task_root" in
    "") return 0 ;;
    /tmp/aster-agent-process-smoke.*) rm -rf -- "$task_root"; task_root="" ;;
    *) return 1 ;;
  esac
}
trap cleanup EXIT HUP INT TERM
task_root="$(mktemp -d /tmp/aster-agent-process-smoke.XXXXXX)"
chmod 700 "$task_root"
cargo build --locked -p aster-agent --bin aster-agent-acceptance-fixture --features client,acceptance-test-provider
GOCACHE="$task_root/go-cache" go -C conformance/agent-go build -o "$task_root/agent-smoke" ./cmd/agent-smoke
fixture="target/debug/aster-agent-acceptance-fixture"
runtime_root="$task_root/runtime"
mkdir "$runtime_root"
chmod 700 "$runtime_root"
"$fixture" prepare --root "$runtime_root"
python3 tools/check-aster-agent-process.py \
  --agent "$fixture" \
  --config "$runtime_root/agent.json" \
  --client "$task_root/agent-smoke" \
  --timeout-seconds 30
'''

[tasks.playground]
description = "Launch a bounded interactive real-process Event message playground"
run = "sh ./tools/aster-mesh-playground.sh"

[tasks.hello]
description = "Open the human-driven three-node Aster Field Notes hello experience"
run = "sh ./tools/aster-hello.sh"

[tasks.hello-smoke]
description = "Exercise the human-driven Field Notes introduction with real agents"
run = "sh ./tools/test-aster-hello-real.sh"

[tasks.playground-smoke]
description = "Exercise delayed Event movement across three real agent processes"
run = "sh ./tools/test-aster-mesh-playground-real.sh"

[tasks.lan-mvp-compose]
description = "Exercise the staged rosterless LAN Event MVP on one Docker bridge"
run = "python3 tools/aster_lan_mvp_compose.py"

[tasks.deb-compose]
description = "Test an existing Aster .deb on two Ubuntu containers with static peers"
run = "python3 tools/aster_deb_compose.py"

