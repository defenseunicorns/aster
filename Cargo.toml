[workspace]
resolver = "3"
members = [
  "crates/aster-profile",
  "crates/aster-redb-store",
  "crates/aster-negentropy",
  "crates/aster-iroh",
  "crates/aster-agent",
  "crates/aster-node",
  "crates/aster-core",
  "crates/aster-host",
  "crates/aster-ip",
  "crates/aster-ble",
  "crates/aster-ffi",
  "crates/aster-conformance",
  "crates/aster-lab",
  "crates/aster-provisioning-age",
  "crates/aster-systemd-credentials",
  "crates/aster-libp2p-provider",
]
exclude = [
  "fuzz",
  "third-party/netlink-packet-core-0.8.2-aster",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
age = { version = "=0.11.5", default-features = false }
age-core = { version = "=0.11.0", default-features = false }
aes-gcm = { version = "=0.11.0", default-features = false, features = ["aes", "alloc", "zeroize"] }
buffa = { version = "=0.9.2", default-features = false, features = ["fast-utf8", "json", "std"] }
bytes = "=1.12.1"
connectrpc = { version = "=0.9.1", default-features = false }
connectrpc-build = "=0.9.0"
futures = "=0.3.34"
getrandom = { version = "=0.4.3", default-features = false, features = ["sys_rng"] }
hkdf = "=0.13.0"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = { version = "=0.5.0", default-features = false }
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.20", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
libc = "=0.2.189"
libp2p = { version = "=0.56.0", default-features = false, features = ["dcutr", "ed25519", "identify", "macros", "memory-connection-limits", "noise", "relay", "tcp", "tokio", "yamux"] }
libp2p-autonat = { version = "=0.15.0", default-features = false, features = ["v1"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc", "hazmat", "zeroize"] }
minicbor = { version = "=2.3.0", default-features = false }
negentropy = "=0.5.1"
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "std"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rand_core = "=0.10.1"
redb = { version = "=4.2.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
socket2 = { version = "=0.6.5", features = ["all"] }
subtle = "=2.6.1"
swarm-discovery = { version = "=0.6.3", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-service = "=0.3.3"
zeroize = { version = "=1.9.0", features = ["derive", "std"] }

[patch.crates-io]
netlink-packet-core = { path = "third-party/netlink-packet-core-0.8.2-aster" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
# C ABI entry points contain every unwind before it reaches a foreign caller.
# `abort` would bypass that containment and terminate an embedding host process.
panic = "unwind"
strip = "symbols"

[profile.bench]
debug = true
