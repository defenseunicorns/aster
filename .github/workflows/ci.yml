name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    # The single-threaded workspace suite now regularly exceeds 30 minutes on
    # hosted runners. Keep every quality gate intact and leave enough headroom
    # for runner variance instead of cancelling an otherwise healthy run.
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.4.28
          cache: false

      - name: Install Rust quality components
        run: rustup component add --toolchain 1.97.1 rustfmt clippy

      - name: Acquire Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          cargo fetch --locked --manifest-path conformance/evaluation-v0/runner/Cargo.toml

      - name: Run formatting, lint, tests, bindings, and conformance
        env:
          CARGO_NET_OFFLINE: "true"
        run: mise run check

  macos-tests:
    name: macOS tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Acquire Rust dependencies
        run: cargo +1.97.1 fetch --locked

      - name: Run workspace tests offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo +1.97.1 test --locked --workspace --all-features

      - name: Run live tour presenter tests
        run: python3 tools/test_aster_tour_ui.py

      - name: Run message playground controller tests
        run: python3 tools/test_aster_mesh_playground.py

      - name: Run real-process message playground smoke
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.97.1"
        run: sh tools/test-aster-mesh-playground-real.sh

  msrv:
    name: Rust 1.91 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Rust 1.91.0
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Acquire Rust dependencies
        run: cargo +1.91.0 fetch --locked

      - name: Check all targets and features offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo +1.91.0 check --locked --workspace --all-targets --all-features

  age-reference-interop:
    name: age reference interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.4.28
          cache: false

      - name: Acquire exact-pinned Rust and Go dependencies
        run: |
          cargo fetch --locked
          GOWORK=off go -C tools/age-reference mod tidy
          GOWORK=off go -C tools/age-reference mod download all
          git diff --exit-code -- tools/age-reference/go.mod tools/age-reference/go.sum

      - name: Install exact-pinned Go vulnerability scanner
        env:
          GOBIN: ${{ runner.temp }}/aster-go-tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Audit the Go reference oracle
        env:
          GOVULNCHECK: ${{ runner.temp }}/aster-go-tools/govulncheck
          GOWORK: "off"
          GOCACHE: ${{ runner.temp }}/aster-age-reference-go-cache
        run: mise run age-reference-audit

      - name: Run bidirectional reference interoperability offline
        env:
          CARGO_NET_OFFLINE: "true"
          GOPROXY: "off"
          GOWORK: "off"
          GOCACHE: ${{ runner.temp }}/aster-age-reference-go-cache
        run: mise run age-reference-interop

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install pinned policy tools
        run: |
          cargo +1.97.1 install --locked cargo-deny --version 0.20.2
          cargo +1.97.1 install --locked cargo-audit --version 0.22.2

      - name: Acquire dependency and advisory data
        run: |
          cargo +1.97.1 fetch --locked
          cargo +1.97.1 fetch --locked --manifest-path fuzz/Cargo.toml
          cargo +1.97.1 deny fetch all
          CARGO_NET_OFFLINE=true sh ./tools/check-dependency-exception-scope.sh
          cargo +1.97.1 audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --file Cargo.lock

      - name: Enforce dependency policy offline
        run: |
          python3 tools/check-netlink-packet-core-patch.py
          CARGO="cargo +1.97.1" python3 tools/check-retained-libp2p-oracle-boundary.py
          python3 tools/test-retained-libp2p-oracle-boundary.py
          CARGO_NET_OFFLINE=true sh ./tools/check-dependency-exception-scope.sh
          CARGO_NET_OFFLINE=true sh ./tools/test-dependency-exception-scope.sh
          cargo +1.97.1 deny --locked --offline check
          cargo +1.97.1 deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked --offline check

      - name: Audit the fuzz lockfile with the refreshed database
        run: cargo +1.97.1 audit --no-fetch --file fuzz/Cargo.lock

  fuzz-smoke:
    name: bounded fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-18 --profile minimal
          cargo +nightly-2026-08-18 install --locked cargo-fuzz --version 0.13.2

      - name: Acquire fuzz dependencies
        run: cargo +nightly-2026-08-18 fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Run bounded fuzz campaigns offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: sh ./tools/run-fuzz-smoke.sh

  required:
    name: required
    if: ${{ always() }}
    needs:
      - quality
      - macos-tests
      - msrv
      - age-reference-interop
      - dependency-policy
      - fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          MACOS_RESULT: ${{ needs.macos-tests.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          AGE_INTEROP_RESULT: ${{ needs.age-reference-interop.result }}
          POLICY_RESULT: ${{ needs.dependency-policy.result }}
          FUZZ_RESULT: ${{ needs.fuzz-smoke.result }}
        run: |
          for result in \
            "$QUALITY_RESULT" \
            "$MACOS_RESULT" \
            "$MSRV_RESULT" \
            "$AGE_INTEROP_RESULT" \
            "$POLICY_RESULT" \
            "$FUZZ_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              printf 'A required CI lane ended with status: %s\n' "$result" >&2
              exit 1
            fi
          done
