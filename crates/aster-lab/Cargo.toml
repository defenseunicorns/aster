[package]
name = "aster-lab"
description = "Deterministic fault-injection and scale laboratory for Aster Mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobins = false

[dependencies]
aster-core = { version = "=0.1.0-alpha.1", path = "../aster-core", features = ["adapter-sdk"] }
aster-host = { version = "=0.1.0-alpha.1", path = "../aster-host", default-features = false }
aster-ip = { version = "=0.1.0-alpha.1", path = "../aster-ip" }
aster-node = { version = "=0.1.0-alpha.1", path = "../aster-node", optional = true }
aster-libp2p-provider = { version = "=0.1.0-alpha.1", path = "../aster-libp2p-provider", optional = true }
getrandom.workspace = true
iroh = { workspace = true, optional = true }
iroh-relay = { version = "=1.2.0", default-features = false, features = ["server", "tls-ring"], optional = true }
libc = { workspace = true, optional = true }
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "ring"], optional = true }
rustls = { workspace = true, optional = true }
sha2.workspace = true
tokio = { workspace = true, features = ["macros"], optional = true }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[features]
default = ["legacy-lab"]
legacy-lab = ["aster-host/legacy-single-contact-service"]
gate-h = ["aster-host/gate-h-formal"]
libp2p-candidate = ["dep:aster-libp2p-provider", "dep:tokio"]
selected-nat = [
  "dep:aster-node",
  "dep:iroh",
  "dep:iroh-relay",
  "dep:libc",
  "dep:rcgen",
  "dep:rustls",
  "dep:rustix",
  "dep:tokio",
]

[[bin]]
name = "aster-lab"
path = "src/main.rs"
required-features = ["legacy-lab"]

[[bin]]
name = "aster-gate-h"
path = "src/gate_h_main.rs"
required-features = ["gate-h"]

[[bin]]
name = "aster-selected-nat"
path = "src/selected_nat_main.rs"
required-features = ["selected-nat"]

[[bin]]
name = "aster-selected-relay"
path = "src/selected_relay_main.rs"
required-features = ["selected-nat"]

[dev-dependencies]
negentropy = "=0.5.1"

[lints]
workspace = true
