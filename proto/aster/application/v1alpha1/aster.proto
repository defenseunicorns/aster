syntax = "proto3";

package aster.application.v1alpha1;

enum PublicErrorReason {
  PUBLIC_ERROR_REASON_UNSPECIFIED = 0;
  PUBLIC_ERROR_REASON_MALFORMED_INPUT = 1;
  PUBLIC_ERROR_REASON_UNSUPPORTED_VALUE = 2;
  PUBLIC_ERROR_REASON_OPERATION_KEY_CONFLICT = 3;
  PUBLIC_ERROR_REASON_MISSING_DURABLE_OBJECT = 4;
  PUBLIC_ERROR_REASON_FAILED_PRECONDITION = 5;
  PUBLIC_ERROR_REASON_DEADLINE = 6;
  PUBLIC_ERROR_REASON_RESOURCE_EXHAUSTION = 7;
  PUBLIC_ERROR_REASON_DRAINING = 8;
  PUBLIC_ERROR_REASON_STATE_UNAVAILABLE = 9;
  PUBLIC_ERROR_REASON_AUTHENTICATION_FAILED = 10;
  PUBLIC_ERROR_REASON_INTERNAL = 11;
  PUBLIC_ERROR_REASON_OPERATION_CAPACITY_EXHAUSTED = 12;
  PUBLIC_ERROR_REASON_SESSION_FENCED = 13;
  PUBLIC_ERROR_REASON_SEQUENCE_GAP = 14;
  PUBLIC_ERROR_REASON_SEQUENCE_RETIRED = 15;
  PUBLIC_ERROR_REASON_RECOVERY_REQUIRED = 16;
  PUBLIC_ERROR_REASON_LEGACY_STATE_REQUIRES_FRESH_STORE = 17;
}

message PublicErrorDetail {
  PublicErrorReason reason = 1;
  string operation = 2;
  bool retryable = 3;
  optional uint32 retry_delay_ms = 4;
}

// AsterApplicationService is the process-local, high-level application API.
//
// The alpha surface exposes only the live Event and status operations backed
// by the running node's sole durable-store authority. It intentionally omits
// cryptographic material, carriers, reconciliation mechanics, sealed bytes,
// provisioning secrets, and stopped-only State/Record operations.
service AsterApplicationService {
  // GetStatus returns a bounded local synchronization snapshot.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // PublishEvent durably accepts an idempotent offline-first publication.
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
  // PublishEvents pipelines ordered independent publications over native HTTP/2.
  rpc PublishEvents(stream PublishEventsRequest) returns (stream PublishEventsResponse);
  // BeginEventPublicationSession fences the prior publisher and returns one complete recovery image.
  rpc BeginEventPublicationSession(BeginEventPublicationSessionRequest) returns (BeginEventPublicationSessionResponse);
  // CompleteEventPublicationRecovery authorizes mutations for the exact recovered revision.
  rpc CompleteEventPublicationRecovery(CompleteEventPublicationRecoveryRequest) returns (CompleteEventPublicationRecoveryResponse);
  // PublishNumberedEvent admits exactly allocated_through + 1 or resolves an exact retry.
  rpc PublishNumberedEvent(PublishNumberedEventRequest) returns (PublishNumberedEventResponse);
  // Ordered numbered publications over bounded native HTTP/2 streams.
  rpc PublishNumberedEvents(stream PublishNumberedEventsRequest) returns (stream PublishNumberedEventsResponse);
  // AbandonEventPublication permanently consumes the next unadmitted sequence.
  rpc AbandonEventPublication(AbandonEventPublicationRequest) returns (AbandonEventPublicationResponse);
  // AcknowledgeEventPublicationResult compacts one sparse committed result.
  rpc AcknowledgeEventPublicationResult(AcknowledgeEventPublicationResultRequest) returns (AcknowledgeEventPublicationResultResponse);
  // QueryEvents returns one marker-ordered, bounded Event page.
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsResponse);
  // CreateEventSubscription creates or replays a durable receive selector.
  rpc CreateEventSubscription(CreateEventSubscriptionRequest) returns (CreateEventSubscriptionResponse);
  // ListEventSubscriptions returns all local Consume subscriptions, ordered by raw ID.
  rpc ListEventSubscriptions(ListEventSubscriptionsRequest) returns (ListEventSubscriptionsResponse);
  // PollEvents returns one bounded page of at-least-once deliveries.
  rpc PollEvents(PollEventsRequest) returns (PollEventsResponse);
  // StreamEvents repeatedly performs bounded durable polls until cancellation.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
  // AcknowledgeEvent durably marks one delivered semantic Event complete.
  rpc AcknowledgeEvent(AcknowledgeEventRequest) returns (AcknowledgeEventResponse);
  // DeleteEventSubscription withdraws a selector and its delivery ledger.
  rpc DeleteEventSubscription(DeleteEventSubscriptionRequest) returns (DeleteEventSubscriptionResponse);
  // QueryEventGaps reports authenticated gaps in one exact publisher stream.
  rpc QueryEventGaps(QueryEventGapsRequest) returns (QueryEventGapsResponse);
}

message ListEventSubscriptionsRequest {}

message ListEventSubscriptionsResponse {
  repeated EventSubscription subscriptions = 1;
}

// One local Event subscription.
message EventSubscription {
  bytes subscription_id = 1;
  string topic = 2;
  string scope = 3;
  bool include_descendant_scopes = 4;
  bytes operation_key = 5;
}

message GetStatusRequest {}

message GetStatusResponse {
  bytes identity = 1;
  bytes mission_authority = 2;
  SyncStatus sync = 3;
  uint64 authenticated_contacts = 4;
  uint64 failed_contact_attempts = 5;
  repeated PeerStatus peers = 6;
  EmissionMode configured_emission_mode = 7;
  EmissionMode effective_emission_mode = 8;
  StoreCapacityStatus store_capacity = 9;
  PublishOperationCapacityStatus publish_operation_capacity = 10;
  DeliveryCapacityStatus delivery_capacity = 11;
  bytes credential_generation = 12;
}

enum EmissionMode {
  EMISSION_MODE_UNSPECIFIED = 0;
  EMISSION_MODE_NORMAL = 1;
  EMISSION_MODE_RECEIVE_ONLY = 2;
}

message StoreCapacityStatus {
  uint64 items = 1;
  uint64 item_limit = 2;
  uint64 payload_bytes = 3;
  uint64 payload_byte_limit = 4;
}

message PublishOperationCapacityStatus {
  uint64 rows = 1;
  uint64 bytes = 2;
  uint64 row_hard_limit = 3;
  uint64 byte_hard_limit = 4;
  uint64 profile_boundary = 5;
  uint64 profile_remaining = 6;
  bool profile_warning = 7;
  bool profile_exhausted = 8;
  uint64 active_rows = 9;
  uint64 retired_rows = 10;
  uint64 reverse_rows = 11;
  uint64 ordinary_remaining = 12;
  uint64 emergency_remaining = 13;
  double rolling_accept_rate = 14;
  uint64 estimated_seconds_to_exhaustion = 15;
  OperationCapacityWarning warning_state = 16;
  OperationLedgerAuditStatus audit = 17;
  PublishOperationLedgerMode ledger_mode = 18;
  uint64 numbered_clients = 19;
  uint64 numbered_outstanding_results = 20;
  uint64 numbered_reverse_rows = 21;
}

enum PublishOperationLedgerMode {
  PUBLISH_OPERATION_LEDGER_MODE_UNSPECIFIED = 0;
  PUBLISH_OPERATION_LEDGER_MODE_LEGACY = 1;
  PUBLISH_OPERATION_LEDGER_MODE_NUMBERED = 2;
}

enum OperationCapacityWarning {
  OPERATION_CAPACITY_WARNING_UNSPECIFIED = 0;
  OPERATION_CAPACITY_WARNING_OK = 1;
  OPERATION_CAPACITY_WARNING_WARNING = 2;
  OPERATION_CAPACITY_WARNING_CRITICAL = 3;
  OPERATION_CAPACITY_WARNING_EXHAUSTED = 4;
}

enum OperationLedgerAudit {
  OPERATION_LEDGER_AUDIT_UNSPECIFIED = 0;
  OPERATION_LEDGER_AUDIT_PENDING = 1;
  OPERATION_LEDGER_AUDIT_RUNNING = 2;
  OPERATION_LEDGER_AUDIT_COMPLETE = 3;
  OPERATION_LEDGER_AUDIT_FAILED = 4;
}

message OperationLedgerAuditStatus {
  OperationLedgerAudit state = 1;
  uint64 scanned = 2;
  uint64 total = 3;
}

message DeliveryCapacityStatus {
  uint64 pending = 1;
  uint64 profile_boundary = 2;
  bool profile_saturated = 3;
  uint64 hard_limit = 4;
}

message PeerStatus {
  bytes peer = 1;
  PeerAuthorization authorization = 2;
  uint64 authenticated_contacts = 3;
  ContactStatus last_contact = 4;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_ROUTINE = 1;
  PRIORITY_PRIORITY = 2;
  PRIORITY_IMMEDIATE = 3;
  PRIORITY_FLASH = 4;
}

enum SyncStatus {
  SYNC_STATUS_UNSPECIFIED = 0;
  SYNC_STATUS_OFFLINE = 1;
  SYNC_STATUS_NO_ACTIVE_CONFIGURED_PEERS = 2;
  SYNC_STATUS_AWAITING_AUTHENTICATED_CONTACT = 3;
  SYNC_STATUS_LAST_CONTACT_COMPLETE = 4;
  SYNC_STATUS_WORK_REMAINED = 5;
  SYNC_STATUS_POLICY_CHANGED_SINCE_CONTACT = 6;
}

enum PeerAuthorization {
  PEER_AUTHORIZATION_UNSPECIFIED = 0;
  PEER_AUTHORIZATION_ACTIVE = 1;
  PEER_AUTHORIZATION_REVOKED = 2;
}

enum ContactStatus {
  CONTACT_STATUS_UNSPECIFIED = 0;
  CONTACT_STATUS_COMPLETE_FOR_LAST_NEGOTIATED_CONTACT = 1;
  CONTACT_STATUS_WORK_REMAINED = 2;
  CONTACT_STATUS_POLICY_CHANGED_SINCE_CONTACT = 3;
}

message PublishEventRequest {
  bytes operation_key = 1;
  optional bytes predecessor_id = 2;
  string topic = 3;
  string scope = 4;
  Priority priority = 5;
  bytes logical_key = 6;
  bytes payload = 7;
  bool tombstone = 8;
  // Optional positive lifetime in milliseconds, authenticated by the publisher.
  // Omitted means durable. Zero and finite tombstones are rejected.
  // Requires a Linux server; this is a duration, not a wall-clock timestamp.
  optional uint64 ttl_ms = 9;
}

message PublishEventResponse {
  bytes id = 1;
  bytes publisher = 2;
  uint64 publisher_counter = 3;
  uint64 event_sequence = 4;
  Priority priority = 5;
  uint64 acceptance_marker = 6;
  bool inserted = 7;
  // Exact source-authenticated duration; omitted for durable Events.
  optional uint64 ttl_ms = 8;
}

message PublishEventsRequest {
  PublishEventRequest publication = 1;
}

message PublishEventsResponse {
  oneof outcome {
    PublishEventResponse published = 1;
    PublicErrorDetail failure = 2;
  }
}

message PublishNumberedEventsRequest {
  PublishNumberedEventRequest publication = 1;
}

message PublishNumberedEventsResponse {
  oneof outcome {
    PublishNumberedEventResponse published = 1;
    PublicErrorDetail failure = 2;
  }
}

message BeginEventPublicationSessionRequest {
  bytes client_id = 1;
  uint64 expected_session = 2;
  bytes claim_nonce = 3;
}

message BeginEventPublicationSessionResponse {
  uint64 session = 1;
  uint64 allocated_through = 2;
  uint64 snapshot_revision = 3;
  repeated CommittedPublicationResult outstanding = 4;
}

message CompleteEventPublicationRecoveryRequest {
  bytes client_id = 1;
  uint64 session = 2;
  uint64 snapshot_revision = 3;
}

message CompleteEventPublicationRecoveryResponse {}

message PublishNumberedEventRequest {
  bytes client_id = 1;
  uint64 session = 2;
  uint64 operation_sequence = 3;
  optional bytes predecessor_id = 4;
  string topic = 5;
  string scope = 6;
  Priority priority = 7;
  bytes logical_key = 8;
  bytes payload = 9;
  bool tombstone = 10;
  optional uint64 ttl_ms = 11;
}

message PublishNumberedEventResponse {
  CommittedPublicationResult result = 1;
  bool inserted = 2;
}

message AbandonEventPublicationRequest {
  bytes client_id = 1;
  uint64 session = 2;
  uint64 operation_sequence = 3;
}

message AbandonEventPublicationResponse {
  bool already_abandoned = 1;
}

message AcknowledgeEventPublicationResultRequest {
  bytes client_id = 1;
  uint64 session = 2;
  uint64 operation_sequence = 3;
}

message AcknowledgeEventPublicationResultResponse {
  bool already_acknowledged = 1;
}

message CommittedPublicationResult {
  uint64 operation_sequence = 1;
  CommittedEventReceipt receipt = 2;
  CommittedContentStatus content = 3;
  optional RetirementReason retirement_reason = 4;
}

message CommittedEventReceipt {
  bytes transfer_id = 1;
  bytes event_id = 2;
  uint64 acceptance_marker = 3;
}

enum CommittedContentStatus {
  COMMITTED_CONTENT_STATUS_UNSPECIFIED = 0;
  COMMITTED_CONTENT_STATUS_AVAILABLE = 1;
  COMMITTED_CONTENT_STATUS_RETIRED = 2;
}

enum RetirementReason {
  RETIREMENT_REASON_UNSPECIFIED = 0;
  RETIREMENT_REASON_EXPIRED = 1;
  RETIREMENT_REASON_QUOTA_PRESSURE = 2;
}

message QueryEventsRequest {
  optional bytes publisher = 1;
  optional string topic = 2;
  optional string scope = 3;
  bool include_descendant_scopes = 4;
  optional bytes logical_key = 5;
  uint64 after_acceptance_marker = 6;
  uint32 limit = 7;
  // Exclusive upper bound; absent means unbounded, present zero means empty.
  optional uint64 before_acceptance_marker = 8;
}

message QueryEventsResponse {
  repeated Event events = 1;
  uint64 scanned_through = 2;
  bool has_more = 3;
}

message Event {
  bytes id = 1;
  bytes publisher = 2;
  uint64 publisher_counter = 3;
  uint64 event_sequence = 4;
  string topic = 5;
  string scope = 6;
  Priority priority = 7;
  bytes logical_key = 8;
  bytes payload = 9;
  bool tombstone = 10;
  uint64 acceptance_marker = 11;
  // Original lifetime, not remaining lifetime or a deletion timestamp.
  optional uint64 ttl_ms = 12;
}

message CreateEventSubscriptionRequest {
  bytes operation_key = 1;
  string topic = 2;
  string scope = 3;
  bool include_descendant_scopes = 4;
}

message CreateEventSubscriptionResponse {
  bytes subscription_id = 1;
  bool inserted = 2;
}

message PollEventsRequest {
  bytes subscription_id = 1;
  uint32 delivery_limit = 2;
  uint32 scan_limit = 3;
}

message PollEventsResponse {
  repeated EventDelivery deliveries = 1;
  bool has_more = 2;
}

message StreamEventsRequest {
  bytes subscription_id = 1;
  uint32 delivery_limit = 2;
  uint32 scan_limit = 3;
  // Delay after each delivered or caught-up poll. Accepted range is 100..=60000.
  uint32 poll_backoff_ms = 4;
}

message StreamEventsResponse {
  Event event = 1;
  uint64 attempt = 2;
}

message EventDelivery {
  Event event = 1;
  uint64 attempt = 2;
}

message AcknowledgeEventRequest {
  bytes subscription_id = 1;
  bytes event_id = 2;
}

message AcknowledgeEventResponse {
  bool already_acknowledged = 1;
}

message DeleteEventSubscriptionRequest {
  bytes subscription_id = 1;
}

message DeleteEventSubscriptionResponse {
  bool already_absent = 1;
}

message QueryEventGapsRequest {
  bytes publisher = 1;
  string topic = 2;
  string scope = 3;
  uint64 after_sequence = 4;
  uint32 scan_limit = 5;
}

message QueryEventGapsResponse {
  repeated EventGap gaps = 1;
  uint64 scanned_through_sequence = 2;
  bool has_more = 3;
}

message EventGap {
  bytes publisher = 1;
  string topic = 2;
  string scope = 3;
  uint64 start_sequence = 4;
  uint64 end_sequence = 5;
}
