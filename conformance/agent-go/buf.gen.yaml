version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/defenseunicorns/aster/conformance/agent-go/gen
plugins:
  - local: protoc-gen-go
    out: conformance/agent-go/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: conformance/agent-go/gen
    opt:
      - paths=source_relative
      - package_suffix
