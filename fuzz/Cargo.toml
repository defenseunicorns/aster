[package]
name = "aster-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
aster-core = { path = "../crates/aster-core", features = ["adapter-sdk"] }
aster-negentropy = { path = "../crates/aster-negentropy" }
aster-node = { path = "../crates/aster-node", features = ["fuzzing"] }
aster-profile = { path = "../crates/aster-profile" }
aster-redb-store = { path = "../crates/aster-redb-store" }
aster-systemd-credentials = { path = "../crates/aster-systemd-credentials", features = ["fuzzing"] }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_decode"
path = "fuzz_targets/fragment_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_inspect"
path = "fuzz_targets/envelope_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selected_frame_decode"
path = "fuzz_targets/selected_frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selected_negentropy"
path = "fuzz_targets/selected_negentropy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classical_profile_decode"
path = "fuzz_targets/classical_profile_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "systemd_credential_decode"
path = "fuzz_targets/systemd_credential_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "systemd_admin_record_decode"
path = "fuzz_targets/systemd_admin_record_decode.rs"
test = false
doc = false
bench = false

[workspace]

[patch.crates-io]
netlink-packet-core = { path = "../third-party/netlink-packet-core-0.8.2-aster" }
