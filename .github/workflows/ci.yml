name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Repository run steps require checkout before this wrapper is available.
    shell: bash .github/scripts/ci-shell.sh {0}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    # Keep headroom for exact-Python setup, support checks, and runner variance.
    # Clippy and the complete Rust workspace tests run in parallel lanes.
    timeout-minutes: 45
    env: &rust-build-profiles
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_WRITE"
      # Change v1 to invalidate the complete compatible compiler cache.
      SCCACHE_GHA_VERSION: "aster-linux-x86_64-rust-1.97.1-v1"
      # Preserve statistics across the long test-only tail of rust-tests.
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - &checkout-source
        name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Initialize CI Python selection
        # runner is unavailable in job env; persist the shell-resolved path
        # for the build, mise setup action, and all later nested mise calls.
        run: |
          : "${RUNNER_TEMP:?CI runner scratch directory is required}"
          : "${GITHUB_ENV:?GitHub Actions environment output is required}"
          printf 'MISE_PYTHON_VERSION=path:%s/aster-ci-python-3.13.7\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install CI Python build prerequisites
        timeout-minutes: 5
        # Ubuntu 24.04 archive/security revisions; log actual installed versions.
        # CI-only native build inputs and version policy: docs/validation/ci-python.md.
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libbz2-dev libffi-dev liblzma-dev \
            libsqlite3-dev libssl-dev zlib1g-dev
          dpkg-query --show --showformat='${Package}\t${Version}\n' \
            build-essential pkg-config libbz2-dev libffi-dev liblzma-dev \
            libsqlite3-dev libssl-dev zlib1g-dev

      - name: Cache exact-source CI Python
        id: ci-python-cache
        uses: &cache-artifacts actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/aster-ci-python-3.13.7
          # Include the build script and workflow (including native prerequisites).
          # Exact matches only: a changed recipe must build from source again.
          key: ubuntu-24.04-${{ runner.arch }}-ci-python-${{ hashFiles('.github/scripts/build-ci-python.sh', '.github/workflows/ci.yml') }}

      - name: Build exact-source signal-safe Python
        if: steps.ci-python-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: bash .github/scripts/build-ci-python.sh

      - name: Validate and select cached CI Python
        if: steps.ci-python-cache.outputs.cache-hit == 'true'
        run: |
          prefix="${MISE_PYTHON_VERSION#path:}"
          "$prefix/bin/python3" -c 'import bz2, ctypes, hashlib, lzma, sqlite3, ssl, zlib; import os; assert hasattr(os, "POSIX_SPAWN_CLOSEFROM")'
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"

      - &setup-toolchain
        name: Install repository toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.4.28
          cache: false

      - &setup-sccache
        name: Install pinned Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Verify direct and nested mise signal-safe Python
        timeout-minutes: 2
        run: |
          python3 .github/scripts/test-ci-python.py
          python3 .github/scripts/check-ci-python.py
          mise exec -- mise run ci-python-preflight

      - name: Install Rust formatting and conformance lint components
        run: rustup component add --toolchain 1.97.1 rustfmt clippy

      - name: Acquire Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          cargo fetch --locked --manifest-path conformance/evaluation-v0/runner/Cargo.toml

      # Keep process acceptance on Linux with the pinned Python 3.13 toolchain;
      # the signal-safe subprocess path requires POSIX_SPAWN_CLOSEFROM.
      - name: Run full agent process contract suite
        timeout-minutes: 5
        run: python3 tools/test-aster-agent-process.py

      - name: Validate Compose-provider delivery policy without Docker
        timeout-minutes: 2
        run: |
          python3 tools/test_aster_compose_delivery.py
          python3 tools/test_inspect_aster_compose_oci.py

      - name: Run formatting, policy, traceability, and receipt checks
        env:
          CARGO_NET_OFFLINE: "true"
        run: mise run check-foundation

      - name: Run real-process, binding, and conformance checks
        env:
          CARGO_NET_OFFLINE: "true"
        run: mise run check-integration

      - name: Run stock agent process smoke
        timeout-minutes: 10
        env:
          CARGO_NET_OFFLINE: "true"
        run: mise run agent-process-smoke

  path-lab-smoke:
    name: path-lab netem smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout-source

      - name: Install exact-pinned Containerlab
        env:
          CONTAINERLAB_SHA256: f90d36d58bb6c4afd3b3a4dca006b81594c6d16f7a04be0184b03f44291085a2
          CONTAINERLAB_URL: https://github.com/srl-labs/containerlab/releases/download/v0.79.0/containerlab_0.79.0_linux_amd64.tar.gz
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$CONTAINERLAB_URL" \
            --output "$RUNNER_TEMP/containerlab.tar.gz"
          printf '%s  %s\n' "$CONTAINERLAB_SHA256" \
            "$RUNNER_TEMP/containerlab.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/containerlab.tar.gz" \
            --directory "$RUNNER_TEMP" containerlab
          chmod 0755 "$RUNNER_TEMP/containerlab"
          "$RUNNER_TEMP/containerlab" version --short

      - name: Build the pinned path-lab node image
        run: |
          docker pull rust@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
          docker build --pull=false --network=none \
            --file docker/path-lab/Dockerfile \
            --tag aster-path-lab:local .

      - name: Execute the netem read-back smoke
        run: |
          sudo python3 tools/aster_path_lab.py \
            docker/path-lab/scenarios/netem-readback-smoke.json \
            --execute \
            --containerlab "$RUNNER_TEMP/containerlab"

  path-delivery-smoke:
    name: path-lab real Event delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout-source

      - name: Validate delivery controller contracts
        run: |
          python3 tools/test_aster_path_delivery.py
          python3 tools/aster_path_delivery.py docker/path-lab/scenarios/event-delivery-netem.json
          docker version --format '{{.Server.Version}}'
          uname -r

      - name: Verify isolated delivery build context
        run: |
          python3 tools/test_delivery_docker_context_probe.py
          python3 tools/probe_delivery_docker_context.py --execute

      - name: Build the real-Event delivery image
        run: |
          docker pull rust@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
          docker build --pull=false \
            --file docker/path-lab/Dockerfile.delivery \
            --tag aster-path-delivery:local .

      - name: Execute the bounded real-Event scenario
        run: |
          sudo python3 tools/aster_path_delivery.py \
            docker/path-lab/scenarios/event-delivery-netem.json \
            --execute \
            --docker "$(command -v docker)"

  macos-tests:
    name: macOS tests
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # Match the resource-bounded workspace test build in the later smoke.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_WRITE"
      # Apple ARM objects are incompatible with the Linux cache namespaces.
      SCCACHE_GHA_VERSION: "aster-macos-arm64-rust-1.97.1-v1"
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - *checkout-source

      - *setup-sccache

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Acquire Rust dependencies
        run: cargo +1.97.1 fetch --locked

      - name: Run workspace tests offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: sh tools/with-test-resources.sh cargo +1.97.1 test --locked --workspace --all-features

      - name: Run live tour presenter tests
        run: python3 tools/test_aster_tour_ui.py

      - name: Run message playground controller tests
        run: python3 tools/test_aster_mesh_playground.py

      - name: Run qualification validator tests
        run: python3 tools/test-linux-event-mvp-qualification.py

      - name: Run real-process message playground smoke
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.97.1"
        run: sh tools/test-aster-mesh-playground-real.sh

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: *rust-build-profiles
    steps:
      - *checkout-source

      - *setup-toolchain

      - *setup-sccache

      - name: Install Clippy
        run: rustup component add --toolchain 1.97.1 clippy

      - name: Acquire Rust dependencies
        run: cargo fetch --locked

      - name: Run Clippy offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: mise run check-clippy

  rust-tests:
    name: Rust tests (${{ matrix.partition }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env: *rust-build-profiles
    steps:
      - *checkout-source

      - *setup-toolchain

      - *setup-sccache

      - name: Install pinned cargo-nextest
        env:
          CARGO_NEXTEST_SHA256: 32aa82416099eb12fffae9cf1a279ad201fecbd3f74826c613e32e9006b29867
          CARGO_NEXTEST_URL: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.145/cargo-nextest-0.9.145-x86_64-unknown-linux-gnu.tar.gz
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$CARGO_NEXTEST_URL" \
            --output "$RUNNER_TEMP/cargo-nextest.tar.gz"
          printf '%s  %s\n' "$CARGO_NEXTEST_SHA256" \
            "$RUNNER_TEMP/cargo-nextest.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/cargo-nextest-bin"
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-nextest.tar.gz" \
            --directory "$RUNNER_TEMP/cargo-nextest-bin" cargo-nextest
          printf '%s\n' "$RUNNER_TEMP/cargo-nextest-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-nextest-bin/cargo-nextest" --version

      - name: Acquire Rust dependencies
        run: cargo fetch --locked

      - name: Run workspace test partition offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: sh tools/with-test-resources.sh cargo nextest run --locked --workspace --all-features --no-fail-fast --test-threads 2 --partition slice:${{ matrix.partition }}/2

      - name: Run complete workspace doctests offline
        if: matrix.partition == 1
        env:
          CARGO_NET_OFFLINE: "true"
        run: sh tools/with-test-resources.sh cargo test --locked --workspace --all-features --doc

  msrv:
    name: Rust 1.91 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout-source

      - name: Install Rust 1.91.0
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Acquire Rust dependencies
        run: cargo +1.91.0 fetch --locked

      - name: Check all targets and features offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo +1.91.0 check --locked --workspace --all-targets --all-features

  age-reference-interop:
    name: age reference interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - *checkout-source

      - *setup-toolchain

      - name: Acquire exact-pinned Rust and Go dependencies
        run: |
          cargo fetch --locked
          GOWORK=off go -C tools/age-reference mod tidy
          GOWORK=off go -C tools/age-reference mod download all
          git diff --exit-code -- tools/age-reference/go.mod tools/age-reference/go.sum

      - name: Install exact-pinned Go vulnerability scanner
        env:
          GOBIN: ${{ runner.temp }}/aster-go-tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Audit the Go reference oracle
        env:
          GOVULNCHECK: ${{ runner.temp }}/aster-go-tools/govulncheck
          GOWORK: "off"
          GOCACHE: ${{ runner.temp }}/aster-age-reference-go-cache
        run: mise run age-reference-audit

      - name: Run bidirectional reference interoperability offline
        env:
          CARGO_NET_OFFLINE: "true"
          GOPROXY: "off"
          GOWORK: "off"
          GOCACHE: ${{ runner.temp }}/aster-age-reference-go-cache
        run: mise run age-reference-interop

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - *checkout-source

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Cache pinned policy tools
        id: policy-tools-cache
        uses: *cache-artifacts
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: ubuntu-24.04-${{ runner.arch }}-policy-rust-1.97.1-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}-v1

      - name: Install pinned policy tools
        if: steps.policy-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo +1.97.1 install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo +1.97.1 install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"

      - name: Verify policy tool versions
        run: |
          test "$(cargo-deny --version)" = "cargo-deny $CARGO_DENY_VERSION"
          test "$(cargo-audit --version)" = "cargo-audit $CARGO_AUDIT_VERSION"

      - name: Acquire dependency and advisory data
        run: |
          cargo +1.97.1 fetch --locked
          cargo +1.97.1 fetch --locked --manifest-path fuzz/Cargo.toml
          cargo +1.97.1 deny fetch all
          CARGO_NET_OFFLINE=true sh ./tools/check-dependency-exception-scope.sh
          cargo +1.97.1 audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --file Cargo.lock

      - name: Enforce dependency policy offline
        run: |
          python3 tools/check-netlink-packet-core-patch.py
          CARGO="cargo +1.97.1" python3 tools/check-retained-libp2p-oracle-boundary.py
          python3 tools/test-retained-libp2p-oracle-boundary.py
          CARGO_NET_OFFLINE=true sh ./tools/check-dependency-exception-scope.sh
          CARGO_NET_OFFLINE=true sh ./tools/test-dependency-exception-scope.sh
          cargo +1.97.1 deny --locked --offline check
          cargo +1.97.1 deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked --offline check

      - name: Audit the fuzz lockfile with the refreshed database
        run: cargo +1.97.1 audit --no-fetch --file fuzz/Cargo.lock

  fuzz-smoke:
    name: bounded fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_WRITE"
      # Keep sanitizer-instrumented nightly objects separate from stable Rust.
      SCCACHE_GHA_VERSION: "aster-linux-x86_64-nightly-2026-08-18-fuzz-v1"
      # Keep statistics available after the bounded campaigns finish.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - *checkout-source

      - *setup-sccache

      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-18 --profile minimal
          cargo +nightly-2026-08-18 install --locked cargo-fuzz --version 0.13.2

      - name: Acquire fuzz dependencies
        run: cargo +nightly-2026-08-18 fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Run bounded fuzz campaigns offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: sh ./tools/run-fuzz-smoke.sh

  runtime-volume-diagnostic:
    name: Run manual runtime-volume diagnostic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci-runtime-volume-diagnostic'
    uses: ./.github/workflows/diagnostic-runtime-volume.yml
    permissions:
      contents: read

  required:
    name: required
    if: ${{ always() }}
    needs:
      - quality
      - rust-clippy
      - rust-tests
      - path-lab-smoke
      - path-delivery-smoke
      - macos-tests
      - msrv
      - age-reference-interop
      - dependency-policy
      - fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation lane
        # This aggregation job does not check out the repository.
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          PATH_LAB_RESULT: ${{ needs.path-lab-smoke.result }}
          PATH_DELIVERY_RESULT: ${{ needs.path-delivery-smoke.result }}
          MACOS_RESULT: ${{ needs.macos-tests.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          AGE_INTEROP_RESULT: ${{ needs.age-reference-interop.result }}
          POLICY_RESULT: ${{ needs.dependency-policy.result }}
          FUZZ_RESULT: ${{ needs.fuzz-smoke.result }}
        run: |
          umask 077
          for result in \
            "$QUALITY_RESULT" \
            "$RUST_CLIPPY_RESULT" \
            "$RUST_TESTS_RESULT" \
            "$PATH_LAB_RESULT" \
            "$PATH_DELIVERY_RESULT" \
            "$MACOS_RESULT" \
            "$MSRV_RESULT" \
            "$AGE_INTEROP_RESULT" \
            "$POLICY_RESULT" \
            "$FUZZ_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              printf 'A required CI lane ended with status: %s\n' "$result" >&2
              exit 1
            fi
          done
