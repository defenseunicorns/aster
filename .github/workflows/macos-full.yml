name: macOS full suite

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-full-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash .github/scripts/ci-shell.sh {0}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: "READ_WRITE"
  SCCACHE_GHA_VERSION: "aster-macos-arm64-rust-1.97.1-v1"
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  full-workspace-tests:
    name: Full macOS workspace tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install pinned Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Acquire Rust dependencies
        run: cargo +1.97.1 fetch --locked

      - name: Run complete workspace tests offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: sh tools/with-test-resources.sh cargo +1.97.1 test --locked --workspace --all-features
